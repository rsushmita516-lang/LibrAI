version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: librai-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - REDIS_URL=redis://redis:6379
      - SESSION_TTL_SECONDS=86400
      - CACHE_TTL_SECONDS=3600
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-10}
      - RATE_LIMIT_WINDOW_SECONDS=60
    depends_on:
      - redis
    volumes:
      - librai_data:/app/data

  redis:
    image: redis:7-alpine
    container_name: librai-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # Optional local Ollama service for fully offline AI execution
  # Uncomment if you want Docker to run Ollama container alongside LibrAI
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: librai-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama

volumes:
  librai_data:
  redis_data:
  # ollama_models:
